services:

  server:
    image: ghcr.io/hrnco/http2tcp-signing-server:latest
    ports:
      - "9075:80"
    environment:
      APP_ENV: dev
      TEST_DEFAULT_PAYLOAD_HEX: '0101000C4654454B415341535441544518|0101000646525354415406|010100064652494E464F1A|010100094652564154494E464F59|010100094654444F43494E464F54|0101000C4654454B415341535441544518|0101000646525354415406|01010037465455494431302D623164353738313131312D63313636303930352D663862382D343536302D396334382D6366343165326534623333361F|0101000846544F50454E333005|0101000B464954454D4131322E33303C|0101000A464954454D547465737411|01010007464954454D513133|01010007464954454D563134|0101000A46544F544131322E333066|0101000D4650415952486F746F766F73747E|0101000646504159493176|0101000A465041594131322E333061|0101000546504159454B|010100074654434C4F534544|010100094654444F43494E464F54'
