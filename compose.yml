services:
  server:
    image: ghcr.io/hrnco/http2tcp-signing-server:latest
    ports:
      - "8080:80"
    environment:
      APP_ENV: dev
    volumes:
      - keys:/keys

  agent:
#    image: ghcr.io/hrnco/http2tcp-local-agent:dev-latest
    build:
      target: DEV
      context: .
      dockerfile: .docker/Dockerfile
#    environment:
#      HTTP2TCP_CORS_ALLOW_ORIGIN: ${HTTP2TCP_CORS_ALLOW_ORIGIN:-*}
#      HTTP2TCP_DOCS_URL: ${HTTP2TCP_DOCS_URL:-https://github.com/hrnco/http2tcp-local-agent}
    ports:
      - "34279:80"
    environment:
      APP_ENV: dev
    volumes:
      - ./:/var/www/html
      - agent_data:/data
    restart: unless-stopped
#    extra_hosts:
#      - "host.docker.internal:host-gateway"

volumes:
  keys:
  agent_data:
